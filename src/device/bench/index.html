<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Logic20 WebUSB 读取评估</title>
<style>
  :root { color-scheme: dark; }
  body { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: #101012; color: #e8e8ea; margin: 0; padding: 24px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 6px; }
  p.hint { color: #9a9aa2; margin: 0 0 18px; }
  fieldset { border: 1px solid #2c2c31; border-radius: 8px; padding: 12px 14px; margin: 0 0 14px; }
  legend { color: #b9b9c0; padding: 0 4px; }
  label { display: inline-flex; align-items: center; gap: 6px; margin: 3px 14px 3px 0; }
  input[type=number], input[type=text] { width: 96px; background: #17171a; color: #eee; border: 1px solid #333; border-radius: 5px; padding: 4px 6px; font: inherit; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #3a3a40; background: #1d1d21; color: #eee; cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: #775AD2; border-color: #775AD2; color: #fff; }
  table { border-collapse: collapse; width: 100%; margin-top: 16px; font-size: 12px; }
  th, td { border-bottom: 1px solid #26262b; padding: 5px 7px; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: #9a9aa2; font-weight: 500; }
  #status { color: #b9b9c0; margin-top: 12px; min-height: 1.5em; }
  #json { width: 100%; height: 150px; background: #151518; color: #c9c9d0; border: 1px solid #2c2c31; border-radius: 6px; padding: 8px; font: inherit; }
</style>
</head>
<body>
<h1>Logic20 WebUSB 读取评估</h1>
<p class="hint">
  插入 Logic20，点击“连接设备”，然后点“运行评估”。每组都会重新采集
  <span id="target-note"></span> 样本，结果可直接复制为 JSON。
</p>

<fieldset>
  <legend>采集</legend>
  <label>采样率 <input id="rate" type="number" value="20000000" step="1000000" /> Hz</label>
  <label>通道 <input id="channels" type="number" value="4" min="1" max="20" step="1" /></label>
  <label>时长 <input id="seconds" type="number" value="1" min="0.1" step="0.1" /> s</label>
  <label>合并提交 <input id="batch" type="text" value="0, 8.33, 16.67" /> ms（0 = 每块提交，逗号分隔）</label>
</fieldset>

<fieldset>
  <legend>读取组合</legend>
  <label>depth <input id="depths" type="text" value="1, 2, 4, 8, 16" /></label>
  <label>read KiB <input id="reads" type="text" value="64, 256" /></label>
</fieldset>

<p>
  <button id="connect" class="primary">连接设备</button>
  <button id="run" disabled>运行评估</button>
  <button id="copy" disabled>复制 JSON</button>
</p>
<div id="status">未连接。</div>

<table hidden id="table">
  <thead>
    <tr>
      <th>depth/read/batch</th><th>用时 ms</th><th>行 MB/s</th><th>读取次数</th>
      <th>平均 ms</th><th>最大 ms</th><th>短包</th><th>峰值在飞</th>
      <th>提交次数</th><th>写入 ms</th><th>样本数</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<h2 style="font-size:14px;margin:20px 0 6px">结果 JSON</h2>
<textarea id="json" readonly placeholder="运行后在此显示，也可用“复制 JSON”。"></textarea>

<script type="module" src="./vllogic-read.ts"></script>
</body>
</html>

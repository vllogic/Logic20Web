<!--
  public/favicon.svg as a maskable app icon: the background is full-bleed (the
  launcher supplies the mask shape) and the VL mark is scaled to 80% about the
  centre so it sits inside the 40%-radius safe zone every mask shape keeps.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#0d1117"/>
  <g transform="translate(16 16) scale(0.8) translate(-16 -16)"
     fill="none" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
    <path stroke="#00d4ff" d="M6 8 L12 23 L18 8"/>
    <path stroke="#ffb020" d="M21 8 V23 H26"/>
  </g>
</svg>

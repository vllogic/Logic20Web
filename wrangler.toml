# Cloudflare Workers static-assets deployment.
#
# Workers Builds uses these defaults:
#   build command:   npm run build
#   deploy command:  npx wrangler deploy
#   preview command: npx wrangler preview
#
# `npm run build` runs the prebuild hook, which vendors Pyodide and the sigrok
# decoder tree on a fresh checkout, then builds dist/ at the domain root.
name = "logic20web"
compatibility_date = "2026-11-13"

[assets]
directory = "./dist"

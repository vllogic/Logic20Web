<!--
  VLLogic Logic20 mark: V and L, with L's stem starting at V's upper-right point.
  Cyan is the instrument accent, amber is the trigger accent. Drawn on a 32x32 grid
  with 3.2px round strokes so the two letters still read at 16x16.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <circle cx="16" cy="16" r="15" fill="#0d1117" stroke="#223044" stroke-width="1.2"/>
  <g fill="none" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    <path stroke="#00d4ff" d="M6 8 L12 23 L18 8"/>
    <path stroke="#ffb020" d="M21 8 V23 H26"/>
  </g>
</svg>
